# ============================================================================
# SIMPRO — GitLab CI/CD
#
# Pipeline: test -> build -> deploy (manual, hanya branch main)
#
#   test    : docker build --target test — menjalankan `php artisan test`
#             DI DALAM image (SQLite :memory:, tidak butuh service eksternal).
#   build   : build image produksi + push ke GitLab Container Registry.
#   deploy  : SSH ke server, pull image, docker compose up -d.
#
# Variabel CI/CD yang WAJIB di-set (Settings -> CI/CD -> Variables):
#   DEPLOY_HOST      — hostname/IP server produksi
#   DEPLOY_USER      — user SSH untuk deploy
#   DEPLOY_SSH_KEY   — private key SSH (masked/protected variable)
#   DEPLOY_DIR       — path di server berisi docker-compose.yml + .env
#   VITE_REVERB_HOST — host websocket yang diakses browser (di-bake ke asset)
#   VITE_REVERB_PORT — port websocket publik (mis. 443 di balik TLS proxy)
#   VITE_REVERB_SCHEME — ws scheme publik: ws / wss
#
# Runner butuh privileged docker:dind (atau runner dengan shell executor +
# docker terpasang — sesuaikan tag runner kantor).
# ============================================================================

stages:
  - test
  - build
  - deploy

variables:
  APP_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""

.docker-common: &docker-common
  image: docker:latest
  services:
    - docker:dind

# ----------------------------------------------------------------------------
# TEST — semua stage image; kegagalan test menggagalkan build (output terlihat
# di log `docker build`).
# ----------------------------------------------------------------------------
test:
  <<: *docker-common
  stage: test
  script:
    - docker build --target test -t simpro-test:$CI_COMMIT_SHORT_SHA .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ----------------------------------------------------------------------------
# BUILD — image produksi -> GitLab Container Registry (tag sha + latest)
# ----------------------------------------------------------------------------
build:
  <<: *docker-common
  stage: build
  needs: [test]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - >
      docker build
      --build-arg VITE_APP_NAME="$VITE_APP_NAME"
      --build-arg VITE_REVERB_APP_KEY="$VITE_REVERB_APP_KEY"
      --build-arg VITE_REVERB_HOST="$VITE_REVERB_HOST"
      --build-arg VITE_REVERB_PORT="$VITE_REVERB_PORT"
      --build-arg VITE_REVERB_SCHEME="$VITE_REVERB_SCHEME"
      -t "$APP_IMAGE"
      -t "$CI_REGISTRY_IMAGE:latest"
      .
    - docker push "$APP_IMAGE"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ----------------------------------------------------------------------------
# DEPLOY — SSH ke server, pull image baru, restart compose. MANUAL trigger.
# Server HARUS sudah punya $DEPLOY_DIR/docker-compose.yml + $DEPLOY_DIR/.env
# (lihat DEPLOYMENT.md).
# ----------------------------------------------------------------------------
deploy:
  stage: deploy
  image: alpine:3.21
  needs: [build]
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - >
      ssh "$DEPLOY_USER@$DEPLOY_HOST" "
        cd $DEPLOY_DIR &&
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' &&
        APP_IMAGE='$APP_IMAGE' docker compose pull &&
        APP_IMAGE='$APP_IMAGE' docker compose up -d --remove-orphans &&
        docker image prune -f
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
