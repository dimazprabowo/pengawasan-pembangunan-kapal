server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Upload lampiran (foto/PDF) — samakan dengan limit php.ini
    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # fastcgi_params bawaan memakai $host (tanpa port) -> URL asset()
        # kehilangan port non-standar (mis. :8000). $http_host menyimpan port.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_read_timeout 120s;
    }

    # Blokir dotfiles (kecuali .well-known untuk ACME/certbot)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
